    <style>
      /* Fail-safe: ensure content is visible if JS fails */
      .gsap-reveal { opacity: 0; }
      .no-js .gsap-reveal { opacity: 1 !important; transform: none !important; }
      .opacity-0 { opacity: 0; }
      .no-js .opacity-0 { opacity: 1 !important; }

      /* Lightweight CSS Hardware-Accelerated Noise / Grid */
      .noise-bg::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.015;
        pointer-events: none;
        z-index: 50;
        background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
        background-size: 24px 24px;
        transform: translateZ(0);
      }

      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .no-scroll {
        overflow: hidden !important;
        height: 100dvh !important;
        position: fixed !important;
        width: 100% !important;
      }

      .glass-card {
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
      }

      .text-gradient {
        background: linear-gradient(135deg, #00F0FF 0%, #00d0e6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: gradient-flow 5s linear infinite;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      }

      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .glow-on-hover:hover {
        box-shadow: 0 0 30px rgba(14, 165, 233, 0.25);
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      html {
        scroll-behavior: auto; /* Handled by Lenis */
      }

      /* Apply custom crosshair only on desktop devices with fine pointers */
      @media (pointer: fine) {
        body {
          cursor: crosshair;
        }
      }
    </style>
